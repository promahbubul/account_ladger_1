<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AccountLedger</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="app-shell">
      /* Painted before the app bundle arrives, so startup is never a blank white page. */
      html, body { background-color: #090A0E; }
      #root:empty::before {
        content: "";
        width: 28px;
        height: 28px;
        margin: auto;
        border: 3px solid #262C38;
        border-top-color: #3B82F6;
        border-radius: 50%;
        animation: app-shell-spin 0.8s linear infinite;
      }
      @keyframes app-shell-spin { to { transform: rotate(360deg); } }
    </style>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div></body>
</html>
