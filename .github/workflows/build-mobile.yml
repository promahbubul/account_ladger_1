# Builds the Android app on Expo whenever mobile code reaches main. Each run uses one EAS build
# from the plan's monthly allowance. It can also be started by hand from the Actions tab.
#
# Repository secret: EXPO_TOKEN (expo.dev -> Settings -> Access Tokens).
# The first build must be run once from a terminal, so EAS can create the signing key:
#   cd mobile && npx eas-cli@latest build --platform android --profile preview
name: Build Mobile App

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview gives an APK to install; production gives an AAB for the Play Store"
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/tests/**"
      - "!mobile/**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start the build on Expo
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --no-wait
