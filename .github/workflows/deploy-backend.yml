# Deploys the backend to cPanel (Setup Node.js App, accountladger-api.nutrimedbd.com)
# over FTP on every push to main that touches backend/. Passenger restarts the
# app when tmp/restart.txt changes.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.nutrimedbd.com
#   FTP_USERNAME   cPanel username (nutrimed) or an FTP account
#   FTP_PASSWORD   its password
#   SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PRIVATE_KEY   optional, see below
#
# Runtime settings (DATABASE_URL, JWT_SECRET, SMTP_*, ...) live in the cPanel
# app's Environment variables, never in GitHub.
name: Deploy Backend (cPanel)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  APP_ROOT: /home/nutrimed/accountladger-api.nutrimedbd.com
  NODEVENV: /home/nutrimed/nodevenv/accountladger-api.nutrimedbd.com/24/bin/activate

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble upload folder
        run: |
          mkdir -p deploy-backend/tmp
          cd backend
          cp -r src prisma server.js package.json package-lock.json ../deploy-backend/
          # Touching this file makes Passenger restart the app after upload.
          date -u > ../deploy-backend/tmp/restart.txt

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-backend/
          server-dir: accountladger-api.nutrimedbd.com/
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            .env
            .htaccess

      # Optional (runs once the SSH_* secrets exist): install dependencies in
      # cPanel's Node.js environment — what "Run NPM Install" does — and restart.
      # The shared host's memory limit kills a full `npm install` over SSH, so it
      # only runs when installed packages no longer match package.json.
      - name: Install dependencies and restart over SSH
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_ROOT,NODEVENV
          script: |
            set -e
            source "$NODEVENV"
            cd "$APP_ROOT"
            if npm ls --omit=dev --depth=0 >/dev/null 2>&1; then
              echo "Dependencies already match package.json; skipping npm install."
            else
              echo "Dependencies changed; installing with a low memory footprint..."
              export UV_THREADPOOL_SIZE=1 NODE_OPTIONS=--max-old-space-size=384
              if ! npm install --omit=dev --no-audit --no-fund --no-progress --maxsockets=2; then
                echo "::error::npm install was stopped by the host's memory limit. In cPanel → Setup Node.js App → accountladger-api.nutrimedbd.com press 'Run NPM Install', then 'Restart'."
                exit 1
              fi
            fi
            mkdir -p tmp && touch tmp/restart.txt
            # touch alone can leave an old instance running; stop this app's Node
            # processes so the host starts a fresh one on the next request.
            for pid in $(pgrep -u "$(id -u)" node || true); do
              if [ "$(readlink /proc/$pid/cwd 2>/dev/null)" = "$APP_ROOT" ]; then kill "$pid" || true; fi
            done
