# Publishes the Android app as a GitHub Release. The landing page always links to the
# newest release, so publishing here is what changes the APK people download.
#
# To publish: Actions -> Publish APK -> Run workflow, and paste the build's APK link from
# expo.dev (the .apk download link under the build's "Install" button).
name: Publish APK

on:
  push:
    tags: ["apk-*"]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the .apk file from expo.dev"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APK_URL: ${{ inputs.apk_url }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Get the APK
        run: |
          mkdir -p dist
          if [ "$EVENT" = "workflow_dispatch" ]; then
            curl -fsSL "$APK_URL" -o dist/AccountLedger-release.apk
          else
            cp frontend/public/AccountLedger-release.apk dist/AccountLedger-release.apk
          fi
          # An expired or wrong link often returns a web page, so check it really is an APK.
          unzip -l dist/AccountLedger-release.apk | grep -q AndroidManifest.xml

      - name: Create the release
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" dist/AccountLedger-release.apk \
            --target "$GITHUB_SHA" \
            --title "Android app $TAG" \
            --notes "SHA-256: $(sha256sum dist/AccountLedger-release.apk | cut -d' ' -f1)" \
            --latest
